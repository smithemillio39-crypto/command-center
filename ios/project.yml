name: CommandCenter

options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CommandCenter:
    type: application
    platform: iOS
    sources:
      - path: CommandCenter
    info:
      path: CommandCenter/Info.plist
      properties:
        CFBundleDisplayName: Command Center
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Command Center sends commands to the agent running on your own PC, over your home network.
        NSCameraUsageDescription: The camera reads the pairing QR that LYRA shows on your PC, so you do not have to type the address and token.
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.commandcenter.pair
            CFBundleURLSchemes:
              - commandcenter
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.commandcenter
        PRODUCT_NAME: CommandCenter
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommandCenter/Info.plist
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
