name: Build iOS app

# Write the app on Windows, push, and this compiles it on a Mac in the cloud.
# The resulting unsigned .ipa is signed and installed by Sideloadly on your PC.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CommandCenter.xcodeproj \
            -scheme CommandCenter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/CommandCenter.app"
          test -d "$APP"
          # Every run must carry a higher build number, or iOS treats the new
          # .ipa as the version already on the phone and refuses to replace it.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          rm -rf Payload CommandCenter.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CommandCenter.ipa Payload
          ls -lh CommandCenter.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CommandCenter-ipa
          path: ios/CommandCenter.ipa
          if-no-files-found: error
          retention-days: 30

      # Every build becomes a release so the phone has a permanent URL to install
      # from (artifacts expire after 30 days and need a signed-in download).
      - name: Publish the build as a release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ios/CommandCenter.ipa --clobber
          else
            gh release create "$TAG" ios/CommandCenter.ipa \
              --title "Build ${GITHUB_RUN_NUMBER}" \
              --notes "Automated build of ${GITHUB_SHA}." \
              --latest
          fi

      # The feed the app reads: newest build first, previous builds kept for
      # rolling back in SideStore or AltStore.
      - name: Refresh the update feed
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/publish_update.py \
            --build "${GITHUB_RUN_NUMBER}" \
            --ipa ios/CommandCenter.ipa \
            --tag "build-${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA:0:7}."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/source.json
          git diff --cached --quiet || git commit -m "Publish build ${GITHUB_RUN_NUMBER} to the update feed"
          git push || (git pull --rebase --autostash && git push)
