name: Build iPhone Portable Drive Studio

# Windows can write this app but cannot compile it. GitHub's macOS runner
# produces an unsigned .ipa; Sideloadly signs it with the user's Apple ID.
# The filesystem job writes a real FAT32 image and checks it with dosfstools
# and mtools, so a green run means the volume is valid, not only compiled.

on:
  push:
    branches: [main]
    paths:
      - "ios-portable-drive-studio/**"
      - ".github/workflows/ios-pvd-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-portable-drive-studio

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PortableDriveStudio.xcodeproj \
            -scheme PortableDriveStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/PortableDriveStudio.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          rm -rf Payload AETHER-Portable-Drive-Studio-iPhone.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AETHER-Portable-Drive-Studio-iPhone.ipa Payload
          ls -lh AETHER-Portable-Drive-Studio-iPhone.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-Portable-Drive-Studio-ipa
          path: ios-portable-drive-studio/AETHER-Portable-Drive-Studio-iPhone.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish the build as a release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pvd-ios-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ios-portable-drive-studio/AETHER-Portable-Drive-Studio-iPhone.ipa --clobber
          else
            gh release create "$TAG" ios-portable-drive-studio/AETHER-Portable-Drive-Studio-iPhone.ipa \
              --title "AETHER Portable Drive Studio iPhone build ${GITHUB_RUN_NUMBER}" \
              --notes "Unsigned iPhone build of ${GITHUB_SHA}. Install with Sideloadly."
          fi

  filesystem:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-portable-drive-studio

    steps:
      - uses: actions/checkout@v4

      - name: Install FAT tools
        run: brew install dosfstools mtools

      - name: Compile the FAT32 fixture
        run: |
          set -euo pipefail
          mkdir -p build-fixture
          swiftc -O \
            PortableDriveStudio/FAT32.swift \
            PortableDriveStudio/AX1VD.swift \
            PortableDriveStudio/Volume.swift \
            tests/FAT32Fixture/main.swift \
            -o build-fixture/fat32fixture

      - name: Write a FAT32 image
        run: ./build-fixture/fat32fixture build build-fixture/work

      - name: Check the image with fsck.fat
        run: |
          set -euo pipefail
          fsck.fat -n -v build-fixture/work/plain.img

      - name: Write and read with mtools
        run: |
          set -euo pipefail
          IMG=build-fixture/work/plain.img
          printf 'written by mtools\n' > build-fixture/work/host.txt
          mdir -i "$IMG" ::/
          mcopy -i "$IMG" build-fixture/work/host.txt ::/HOST.TXT
          mtype -i "$IMG" ::/HOST.TXT > build-fixture/work/roundtrip.txt
          diff build-fixture/work/host.txt build-fixture/work/roundtrip.txt
          mdir -i "$IMG" ::/

      - name: Check the image again after mtools wrote to it
        run: |
          set -euo pipefail
          fsck.fat -n -v build-fixture/work/plain.img

      - name: Read the mtools file with our reader
        run: |
          set -euo pipefail
          ./build-fixture/fat32fixture cat build-fixture/work/plain.img HOST.TXT > build-fixture/work/read-back.txt
          diff build-fixture/work/host.txt build-fixture/work/read-back.txt

      - name: Build an AX1VD cartridge
        run: ./build-fixture/fat32fixture cartridge build-fixture/work

      - name: Check the cartridge volume with fsck.fat
        run: |
          set -euo pipefail
          tail -c +69633 build-fixture/work/cartridge.vdrive > build-fixture/work/cartridge.img
          fsck.fat -n -v build-fixture/work/cartridge.img
          mdir -i build-fixture/work/cartridge.img ::/
