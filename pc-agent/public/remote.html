<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Command Center</title>
<style>
  :root {
    --violet: #8b5cf6;
    --violet-soft: #6d43d6;
    --mint: #5eead4;
    --amber: #fbbf24;
    --pink: #f472b6;
    --ink: #08060d;
    --card: rgba(255, 255, 255, 0.055);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f4f1ff;
    --muted: rgba(244, 241, 255, 0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.4 -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #100a1c 0%, var(--ink) 42%, #05040a 100%);
    background-attachment: fixed;
  }

  /* Lyra's own portrait, graded violet, behind the frosted glass. */
  .backdrop {
    position: fixed;
    inset: -20px;
    z-index: -2;
    background: url("backdrop.jpg") center top / cover no-repeat;
    filter: blur(6px) saturate(1.2) brightness(0.92);
    transform: scale(1.03);
  }
  .veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(130% 55% at 50% -6%, rgba(139, 92, 246, 0.34), transparent 68%),
      linear-gradient(180deg, rgba(8, 6, 13, 0.22) 0%, rgba(8, 6, 13, 0.48) 42%, rgba(5, 4, 10, 0.86) 100%);
  }
  .phone {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    padding: 18px 16px calc(26px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 2px 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 12px currentColor; }
  .dot.on { background: var(--mint); color: var(--mint); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .card {
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(158deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.055) 34%, rgba(255, 255, 255, 0.03) 100%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    padding: 14px;
    backdrop-filter: blur(26px) saturate(1.7);
    -webkit-backdrop-filter: blur(26px) saturate(1.7);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.32),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 18px 44px rgba(0, 0, 0, 0.38);
  }
  /* Specular sheen across the top-left of every card. */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(126deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 24%, transparent 46%);
  }
  .card h2 {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 700;
  }
  .row { display: flex; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }

  button {
    position: relative;
    font: inherit;
    color: var(--text);
    background:
      linear-gradient(165deg, rgba(255, 255, 255, 0.19) 0%, rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.05) 100%);
    border: 1px solid rgba(255, 255, 255, 0.17);
    border-radius: 14px;
    padding: 11px 12px;
    cursor: pointer;
    transition: transform .08s ease, box-shadow .18s ease, filter .18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    backdrop-filter: blur(16px) saturate(1.5);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.30),
      0 10px 22px rgba(0, 0, 0, 0.28);
  }
  button:hover {
    filter: brightness(1.16);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      0 12px 26px rgba(0, 0, 0, 0.32);
  }
  button:active { transform: scale(.97); }
  button.tile { flex-direction: column; gap: 6px; padding: 14px 10px; font-size: 11.5px; font-weight: 600; }
  button.tile .glyph { font-size: 19px; line-height: 1; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid.three { grid-template-columns: repeat(3, 1fr); }
  .grid.two { grid-template-columns: repeat(2, 1fr); }

  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }
  .card-head .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-head .icon-btn { width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 13px; background: rgba(255,255,255,.10); flex: none; }

  .wins { display: flex; flex-direction: column; gap: 6px; }
  .win {
    justify-content: flex-start; gap: 11px; padding: 8px 10px; border-radius: 14px; text-align: left;
    background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
    border-color: rgba(255,255,255,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.20), 0 6px 16px rgba(0,0,0,.22);
  }
  .win .glyph {
    font-size: 15px; width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none;
    background: linear-gradient(160deg, rgba(255,255,255,.20), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
  }
  .win .meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .win .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .go { font-size: 12px; color: rgba(244, 241, 255, .28); flex: none; }
  .win.busy { opacity: .5; }
  .win-empty { margin: 0; font-size: 12.5px; color: var(--muted); padding: 6px 2px; }
  .link-btn { width: 100%; margin-top: 6px; padding: 6px; border: 0; background: transparent; color: var(--violet); font-size: 12px; font-weight: 600; }
  .link-btn:hover { background: transparent; text-decoration: underline; }

  .accent {
    background: linear-gradient(165deg, rgba(178, 148, 255, .58), rgba(124, 88, 232, .34) 55%, rgba(109, 67, 214, .28));
    border-color: rgba(190, 165, 255, .58);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 12px 26px rgba(76, 40, 160, .38);
  }
  .danger {
    background: linear-gradient(165deg, rgba(244, 63, 94, .28), rgba(244, 63, 94, .12));
    border-color: rgba(244, 63, 94, .45);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26), 0 10px 22px rgba(0, 0, 0, .28);
  }
  .media { font-size: 17px; padding: 15px 0; }
  .media button { flex: 1; }

  .volume { display: flex; align-items: center; gap: 12px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 26px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -7px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(139,92,246,.35), 0 2px 8px rgba(0,0,0,.5);
  }
  .volume .value { font-size: 12px; color: var(--muted); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

  textarea {
    width: 100%;
    min-height: 62px;
    resize: none;
    font: inherit;
    color: var(--text);
    background: rgba(0, 0, 0, .32);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
  }
  textarea::placeholder { color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 20px);
    background: linear-gradient(160deg, rgba(58, 40, 92, .82), rgba(20, 14, 32, .78));
    backdrop-filter: blur(22px) saturate(1.6);
    -webkit-backdrop-filter: blur(22px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.20);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 14px 30px rgba(0, 0, 0, 0.42);
    color: var(--text);
    font-size: 12px;
    padding: 9px 14px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  a { color: var(--violet); }
  .fine { font-size: 10.5px; color: var(--muted); text-align: center; padding-top: 2px; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="veil"></div>
<div class="phone">
  <header>
    <span class="dot" id="dot"></span>
    <div style="flex:1">
      <h1>Command Center</h1>
      <div class="sub" id="who">connecting…</div>
    </div>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>On the PC</h2>
      <span class="count" id="winCount"></span>
      <button class="icon-btn" id="winRefresh" title="Refresh window list">⟳</button>
    </div>
    <div class="wins" id="winList"></div>
    <button class="link-btn" id="winMore" hidden></button>
  </section>

  <section class="card">
    <h2>Volume</h2>
    <div class="volume">
      <button id="mute" class="tile" style="width:52px;padding:10px 0" title="Mute">
        <span class="glyph">🔊</span>
      </button>
      <input id="vol" type="range" min="0" max="100" step="2" value="50">
      <span class="value" id="volValue">50%</span>
    </div>
  </section>

  <section class="card">
    <h2>Media</h2>
    <div class="row media">
      <button data-action="media.prev" title="Previous">⏮</button>
      <button data-action="media.playpause" class="accent" title="Play / pause">⏯</button>
      <button data-action="media.next" title="Next">⏭</button>
      <button data-action="media.stop" title="Stop">⏹</button>
    </div>
  </section>

  <section class="card">
    <h2>Launch</h2>
    <div class="grid">
      <button class="tile" data-launch="steam"><span class="glyph">🎮</span>Steam</button>
      <button class="tile" data-launch="steam-bigpicture"><span class="glyph">🕹️</span>Big Picture</button>
      <button class="tile" data-launch="chrome"><span class="glyph">🌐</span>Chrome</button>
      <button class="tile" data-launch="discord"><span class="glyph">💬</span>Discord</button>
      <button class="tile" data-launch="spotify"><span class="glyph">🎵</span>Spotify</button>
      <button class="tile" data-launch="explorer"><span class="glyph">📁</span>Files</button>
      <button class="tile" data-launch="settings"><span class="glyph">⚙️</span>Settings</button>
      <button class="tile" data-launch="terminal"><span class="glyph">⌨️</span>Terminal</button>
    </div>
  </section>

  <section class="card">
    <h2>Type on the PC</h2>
    <textarea id="text" placeholder="Tap a window above first, then type here."></textarea>
    <div class="row" style="margin-top:8px">
      <button id="sendText" class="accent" style="flex:2">Type it</button>
      <button id="sendEnter" style="flex:1" title="Send Enter">⏎</button>
    </div>
  </section>

  <section class="card">
    <h2>Power</h2>
    <div class="grid three">
      <button class="tile" data-action="system.lock"><span class="glyph">🔒</span>Lock</button>
      <button class="tile" data-action="system.sleep"><span class="glyph">🌙</span>Sleep</button>
      <button class="tile" data-action="system.displayOff"><span class="glyph">🖥️</span>Screen off</button>
    </div>
    <div class="grid two" style="margin-top:8px">
      <button class="danger" data-action="system.restart">Restart in 60s</button>
      <button class="danger" data-action="system.shutdown">Shut down in 60s</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button data-action="system.cancelShutdown" style="flex:1">Cancel pending shutdown</button>
    </div>
  </section>

  <p class="fine">Same endpoints as the iPhone app · <a href="/">agent status</a></p>
</div>

<div class="toast" id="toast"></div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || localStorage.getItem('cc.token') || '';
  if (params.get('token')) localStorage.setItem('cc.token', params.get('token'));

  const dot = document.getElementById('dot');
  const who = document.getElementById('who');
  const vol = document.getElementById('vol');
  const volValue = document.getElementById('volValue');
  const mute = document.getElementById('mute');

  let toastTimer = 0;
  function toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  async function api(path, body) {
    const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
    const options = body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : {};
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
    return data;
  }

  function paintStatus(data) {
    dot.classList.add('on');
    const port = location.port ? ' · port ' + location.port : '';
    who.textContent = data.host + port + (data.muted ? ' · muted' : '');
    if (typeof data.volume === 'number') {
      vol.value = data.volume;
      volValue.textContent = data.volume + '%';
    }
    mute.querySelector('.glyph').textContent = data.muted ? '🔇' : '🔊';
  }

  async function refresh() {
    try {
      paintStatus(await api('/status'));
    } catch (error) {
      dot.classList.remove('on');
      who.textContent = 'agent offline — ' + error.message;
    }
  }

  async function command(action, value) {
    try {
      const data = await api('/command', { action, value });
      if (typeof data.volume === 'number') {
        vol.value = data.volume;
        volValue.textContent = data.volume + '%';
      }
      toast(data.result || action);
    } catch (error) {
      toast('✕ ' + error.message);
    }
  }

  document.querySelectorAll('[data-action]').forEach((button) => {
    button.addEventListener('click', () => command(button.dataset.action));
  });

  document.querySelectorAll('[data-launch]').forEach((button) => {
    button.addEventListener('click', () => command('app.launch', button.dataset.launch));
  });

  mute.addEventListener('click', () => command('volume.mute'));

  let volumeTimer = 0;
  vol.addEventListener('input', () => { volValue.textContent = vol.value + '%'; });
  vol.addEventListener('change', () => {
    clearTimeout(volumeTimer);
    const value = Number(vol.value);
    volumeTimer = setTimeout(() => command('volume.set', value), 120);
  });

  async function typeText(text) {
    if (!text) return;
    try {
      await api('/input', { t: 'type', text });
      toast('typed ' + text.length + ' characters');
    } catch (error) {
      toast('✕ ' + error.message);
    }
  }

  document.getElementById('sendText').addEventListener('click', async () => {
    const box = document.getElementById('text');
    await typeText(box.value);
    box.value = '';
  });

  document.getElementById('sendEnter').addEventListener('click', async () => {
    try {
      await api('/input', { t: 'key', vk: 13 });
      toast('enter');
    } catch (error) {
      toast('✕ ' + error.message);
    }
  });

  /* ---- the PC's open windows: one tap raises that window on the PC ---- */
  const winList = document.getElementById('winList');
  const winCount = document.getElementById('winCount');
  const winRefresh = document.getElementById('winRefresh');
  const winMore = document.getElementById('winMore');
  const COLLAPSED = 6;

  let windows = [];
  let showAllWindows = false;
  let windowsBusy = false;
  let windowsLoaded = false;

  const GLYPHS = [
    [/^(chrome|msedge|firefox|brave|opera|vivaldi|arc)$/, '🌐'],
    [/^(explorer)$/, '📁'],
    [/^steam/, '🎮'],
    [/^(discord)$/, '💬'],
    [/^(spotify)$/, '🎵'],
    [/^(code|cursor|devenv|sublime_text)$/, '🧑‍💻'],
    [/^(windowsterminal|wt|powershell|pwsh|cmd|conhost)$/, '⌨️'],
    [/^(notepad\+\+|notepad|wordpad)$/, '📄'],
    [/^(photos|mspaint|paint|snippingtool)$/, '🖼️'],
    [/^(python|pythonw|lyra)$/, '✨'],
    [/^(taskmgr|systemsettings|applicationframehost)$/, '⚙️'],
    [/^(sideloadly)$/, '📲'],
    [/^(vlc|mpc-hc64|wmplayer)$/, '▶️'],
    [/^(winword|powerpnt)$/, '📄'],
    [/^(excel)$/, '📊'],
  ];

  function glyphFor(process) {
    const name = String(process || '').toLowerCase();
    for (const [pattern, glyph] of GLYPHS) if (pattern.test(name)) return glyph;
    return '🪟';
  }

  function windowRow(entry) {
    const button = document.createElement('button');
    button.className = 'win';
    button.type = 'button';

    const glyph = document.createElement('span');
    glyph.className = 'glyph';
    glyph.textContent = glyphFor(entry.process);

    const meta = document.createElement('span');
    meta.className = 'meta';

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = entry.title || (entry.process || 'window');

    const sub = document.createElement('span');
    sub.className = 'sub';
    const name = entry.process || 'app';
    sub.textContent = entry.minimized === true ? name + ' · minimized' : name;

    const go = document.createElement('span');
    go.className = 'go';
    go.textContent = '↗';

    meta.append(title, sub);
    button.append(glyph, meta, go);
    button.addEventListener('click', () => activateWindow(entry, button));
    return button;
  }

  function renderWindows() {
    winList.replaceChildren();
    winCount.textContent = windowsLoaded && windows.length ? String(windows.length) : '';
    winMore.hidden = true;

    if (!windows.length) {
      const empty = document.createElement('p');
      empty.className = 'win-empty';
      empty.textContent = windowsLoaded ? 'No open windows on the PC.' : 'Reading windows…';
      winList.append(empty);
      return;
    }

    const visible = !showAllWindows && windows.length > COLLAPSED ? windows.slice(0, COLLAPSED) : windows;
    for (const entry of visible) winList.append(windowRow(entry));

    if (windows.length > COLLAPSED) {
      winMore.hidden = false;
      winMore.textContent = showAllWindows ? 'Show fewer' : 'Show all ' + windows.length;
    }
  }

  async function loadWindows() {
    if (windowsBusy) return;
    windowsBusy = true;
    winRefresh.disabled = true;
    if (!windowsLoaded) renderWindows();
    try {
      const data = await api('/windows');
      windows = Array.isArray(data.windows) ? data.windows : [];
      windowsLoaded = true;
    } catch (error) {
      windows = [];
      windowsLoaded = false;
      const empty = document.createElement('p');
      empty.className = 'win-empty';
      empty.textContent = 'Could not read the PC\u2019s windows \u2014 ' + error.message;
      winList.replaceChildren(empty);
      winCount.textContent = '';
      winMore.hidden = true;
      winRefresh.disabled = false;
      windowsBusy = false;
      return;
    }
    winRefresh.disabled = false;
    windowsBusy = false;
    renderWindows();
  }

  async function activateWindow(entry, button) {
    button.classList.add('busy');
    try {
      await api('/windows/activate', { hwnd: entry.hwnd });
      toast('switched to ' + (entry.title || entry.process || 'window'));
    } catch (error) {
      toast('✕ ' + error.message);
    } finally {
      setTimeout(() => button.classList.remove('busy'), 700);
      loadWindows();
    }
  }

  winRefresh.addEventListener('click', loadWindows);
  winMore.addEventListener('click', () => {
    showAllWindows = !showAllWindows;
    renderWindows();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadWindows();
  });

  renderWindows();
  loadWindows();

  refresh();
  setInterval(refresh, 5000);
  setInterval(() => { if (!document.hidden) loadWindows(); }, 20000);
</script>
</body>
</html>
